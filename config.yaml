    - HTML
    - RSS
    - JSON
  page:
    - HTML
    - RSS

paginate: 3
enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog
      url: /blogs
      weight: 3

params:
  title: "Robert Viquez"
  description: "Systems engineer focused on cloud infrastructure, DevOps, Linux, automation, and building reliable systems."
