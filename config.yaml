  animate: true

  theme:
    disableThemeToggle: false
    defaultTheme: "dark"

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  color:
    textColor: "#343a40"
    secondaryTextColor: "#6c757d"
    textLinkColor: "#6c757d"
    backgroundColor: "#eaedf0"
    secondaryBackgroundColor: "#64ffda1a"
    primaryColor: "#343a40"
    secondaryColor: "#f8f9fa"

  navbar:
    align: ms-auto
    showBrandLogo: false
    brandName: "Robert Viquez"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: true
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: true

  hero:
    enable: true
    intro: "Hi, I'm"
    title: "Robert Viquez"
    subtitle: "Systems Engineer | Cloud · DevOps · Infrastructure"
    content: "I build, automate, and operate systems using Linux, containers, cloud technologies, networking, and infrastructure tooling."
    bottomImage:
      enable: true
    roundImage: false
    button:
      enable: false
      name: "Resume"
      url: "#"
      download: true
      newPage: false
    socialLinks:
