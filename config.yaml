        - icon: fab fa-github
          url: https://github.com/robert-viquez
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/robert-viquez/

  about:
    enable: true
    title: "About Me"
    image: "/images/logo1.png"
    content: |-
      I'm a Systems Engineering graduate focused on cloud infrastructure, DevOps, Linux, networking, and automation.

      I learn by building and operating real systems. My projects include a Proxmox-based homelab, Linux virtual machines, containerized applications, CI/CD workflows, and software projects that help me deepen my understanding of how applications and infrastructure work together.

      I'm currently expanding my AWS knowledge and preparing for an AWS certification while pursuing opportunities in Cloud, DevOps, Infrastructure, and related engineering roles.
    skills:
      enable: true
      title: "Core Technologies:"
      items:
        - '<i class="fab fa-linux"></i> Linux'
        - '<i class="fab fa-docker"></i> Docker & Docker Compose'
        - '<i class="fab fa-aws"></i> AWS (studying for certification)'
        - '<i class="fab fa-git-alt"></i> Git & GitHub'
        - '<i class="fab fa-python"></i> Python'
        - '<i class="fas fa-network-wired"></i> Networking'
        - '<i class="fas fa-server"></i> Proxmox & Virtual Machines'
        - '<i class="fas fa-terminal"></i> Bash / CLI'
        - '<i class="fas fa-code-branch"></i> GitHub Actions / CI-CD'
        - '<i class="fas fa-database"></i> MySQL'

